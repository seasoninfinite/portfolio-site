<!DOCTYPE html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head>
<body>
<!-- Netlify Forms detection only. The contact wizard (src/components/site/contact-wizard.tsx) posts here. -->
<form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="enquiry">
  <input name="bot-field">
  <input name="intent">
  <input name="name">
  <input name="email">
  <input name="business">
  <input name="website">
  <textarea name="message"></textarea>
  <input name="terms">
  <input name="startNow">
</form>
<!-- Client portal (public/portal/index.html) posts these. Generated by the BGG Onboarding Kit. -->
<form name="project-brief" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="project-brief">
<input name="client"><input name="business"><input name="bot-field">
<textarea name="what_you_do"></textarea><textarea name="why_you"></textarea><textarea name="services"></textarea><textarea name="area"></textarea>
<textarea name="customers"></textarea><input name="searches"><textarea name="questions"></textarea><input name="action"><input name="booking_system">
<textarea name="page_1"></textarea><input name="page_1_name"><textarea name="page_2"></textarea><input name="page_2_name"><textarea name="page_3"></textarea><input name="page_3_name">
<textarea name="page_4"></textarea><input name="page_4_name"><textarea name="page_5"></textarea><input name="page_5_name"><textarea name="page_6"></textarea><input name="page_6_name">
<textarea name="page_7"></textarea><input name="page_7_name"><textarea name="page_8"></textarea><input name="page_8_name"><textarea name="page_9"></textarea><input name="page_9_name">
<textarea name="page_10"></textarea><input name="page_10_name"><input name="wording"><input name="style"><input name="colours"><input name="logo">
<textarea name="sites_liked"></textarea><textarea name="avoid"></textarea><input name="features"><input name="domain_status"><input name="domain"><input name="current_site">
<input name="gbp"><input name="enquiry_email"><input name="phone"><textarea name="socials"></textarea><input name="deadline"><input name="care"><textarea name="anything_else"></textarea>
</form>
<form name="change-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="change-request"><input name="client"><input name="business"><input name="round"><textarea name="changes"></textarea><input name="bot-field"></form>
<form name="approval" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="approval"><input name="client"><input name="business"><input name="approved"><input name="name"><textarea name="note"></textarea><input name="bot-field"></form>
<form name="client-review" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="client-review"><input name="client"><input name="business"><input name="name"><input name="stars"><textarea name="review"></textarea><input name="permission_to_publish"><input name="bot-field"></form>
<form name="referral" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="referral"><input name="client"><input name="referred_by"><input name="their_business"><input name="their_name"><input name="their_contact"><textarea name="note"></textarea><input name="consent"><input name="bot-field"></form>
</body>
</html>
